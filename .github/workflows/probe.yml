name: Probe mac runners
on:
  push:
    branches: ["test/**"]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, macos-13, macos-14-large, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: sw_vers; uname -m; xcrun swiftc --version
